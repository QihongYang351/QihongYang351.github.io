title = "垂直权力结构中的政策再创新与政策绩效：来自中国乡村振兴政策的证据"
description = "这项研究以中国乡村振兴政策为背景，考察垂直权力结构中省、市两级政府的政策再创新如何共同影响政策实施绩效，并分析政策采纳速度与不同再创新类型的作用。"

